[package]
name = "voom-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
test = ["voom-control-plane/test"]

[dependencies]
axum = "0.8.9"
axum-server = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
voom-control-plane = { workspace = true }
voom-core = { workspace = true }

[dev-dependencies]
hyper = { workspace = true }
http-body = { workspace = true }
http-body-util = "0.1.3"
rcgen = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
voom-test-support = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tokio-rustls = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
voom-store = { workspace = true, features = ["test"] }
voom-events = { workspace = true }
