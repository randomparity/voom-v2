name: chaos-e2e

on:
  workflow_dispatch:
  schedule:
    # Weekly run on the default branch so this otherwise dispatch-only job
    # cannot silently rot (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: chaos-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chaos-e2e:
    name: chaos-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Carries the failing step's id to notify-failure, which cannot see this job's
    # steps context. It is the dedupe key for the tracking issue.
    outputs:
      failing-step: ${{ steps.name-failing-step.outputs.name }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Cache cargo
        id: cache-cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3  # v2.9.1

      - name: Install just
        id: install-just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install uv
        id: install-uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install MKVToolNix
        id: install-mkvtoolnix
        run: |
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix

      - name: Install ffmpeg
        id: install-ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
          # Chaos Librarian documents ffmpeg/ffprobe 7.0+ as its floor
          # (third_party/chaos-librarian/README.md). BtbN retires release series,
          # so the series is resolved at run time rather than named here. See
          # docs/adr/0078-runtime-resolved-ffmpeg-series.md.
          # ASCII-only digit handling; see scripts/select-ffmpeg-asset.sh.
          LC_ALL: C
          FFMPEG_MAJOR_FLOOR: "7"
          FFMPEG_RELEASE_BASE_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
        run: |
          assets="$RUNNER_TEMP/ffmpeg-assets.txt"
          # Addressed by tag: `releases/latest` asks GitHub for whichever release it
          # considers newest, which is BtbN's to repoint at a dated autobuild whose
          # asset names have a different shape. Writing to a file rather than piping
          # keeps a failed release read attributable to `gh` itself, instead of
          # reaching the selector as an empty stdin it can only report second-hand.
          gh api repos/BtbN/FFmpeg-Builds/releases/tags/latest --jq '.assets[].name' >"$assets"
          asset=$(./scripts/select-ffmpeg-asset.sh "$FFMPEG_MAJOR_FLOOR" <"$assets")
          echo "Selected asset: $asset"
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          install_dir="$RUNNER_TEMP/ffmpeg"
          curl -fL "$FFMPEG_RELEASE_BASE_URL/$asset" -o "$archive"
          mkdir -p "$install_dir"
          tar -xJf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          # No `| head -n1`: closing the pipe early can reap ffmpeg with SIGPIPE.
          version_output=$("$install_dir/bin/ffmpeg" -version)
          installed_version=${version_output%%$'\n'*}
          echo "Installed: $installed_version"
          # Check the match first. The earlier shape put the arithmetic inside an
          # `if` condition after `||`, where an error returned 1, skipped the error
          # branch, and accepted a below-floor build outright.
          if [[ ! $installed_version =~ ^ffmpeg\ version\ n?([[:digit:]]+)\. ]]; then
            echo "::error::could not parse an ffmpeg major version from: $installed_version"
            exit 1
          fi
          installed_major=$((10#${BASH_REMATCH[1]}))
          # Validate the result rather than the assignment's status. Neither `set -e`
          # nor `||` catches a failing arithmetic expansion in an assignment: under
          # `bash -e` it prints its error, leaves the name empty, and returns 0. The
          # `[[:digit:]]` match above is the real guarantee that only ASCII digits
          # reach `10#`; this is the check that holds if that ever stops being true.
          if [[ ! $installed_major =~ ^[[:digit:]]+$ ]]; then
            echo "::error::could not evaluate the major version in: $installed_version"
            exit 1
          fi
          # FFMPEG_MAJOR_FLOOR reaches this arithmetic already validated: the selector
          # above rejects a non-integer or zero-padded floor with exit 2 before the
          # download runs. That coupling is why no floor check is repeated here --
          # do not add one, and do not reorder this after removing that call.
          if ((installed_major < FFMPEG_MAJOR_FLOOR)); then
            echo "::error::expected ffmpeg >= $FFMPEG_MAJOR_FLOOR, got: $installed_version"
            exit 1
          fi

      - name: Verify external tools
        id: verify-external-tools
        run: |
          uv --version
          uv python install 3.13
          uv run --python 3.13 python --version
          ffmpeg -version
          ffprobe -version
          mkvmerge --version

      - name: Run Chaos Librarian E2E
        id: run-chaos-e2e
        run: just chaos-e2e-ci

      # Names the step that failed, so notify-failure can key one tracking issue per
      # distinct failure instead of filing a fresh one every week. Keyed by step id
      # because `toJSON(steps)` is keyed by id: a step added above with an `id:` is
      # covered here with no second list of names to keep in sync, and a short slug
      # reads well in an issue title.
      #
      # This separates a setup failure from an E2E failure and no finer: `just
      # chaos-e2e-ci` bundles `uv sync`, the cargo build and the test run into this
      # one step, so genuinely different failures inside it still share a key. That
      # residual is deliberate -- see the design doc.
      - name: Name the failing step
        id: name-failing-step
        if: failure()
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
          # The charset guard below is a bracket range, and glibc resolves a range
          # through the locale's collation -- under a UTF-8 locale it admits
          # Arabic-Indic and fullwidth digits. Same guard, same reason, as the
          # ffmpeg step above.
          LC_ALL: C
        run: |
          # No `shell:` key means `bash -e` WITHOUT pipefail. jq reads a here-string
          # rather than a pipe so a jq failure is the assignment's own status and
          # `set -e` catches it either way.
          set -euo pipefail
          # `.value.outcome?` tolerates a non-object entry rather than aborting the
          # filter. `first // "unknown-step"`: `first` of an empty array is null, and
          # `null // x` is x, so the caller always gets a usable key.
          name=$(jq -r '
            [to_entries[] | select(.value.outcome? == "failure") | .key]
            | first // "unknown-step"' <<<"$STEPS_CONTEXT")
          # Actions already constrains a step id to this shape, so this is a boundary
          # check rather than a transformation: the value reaches an issue title and a
          # search query in a job that holds `issues: write`.
          if [[ ! $name =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo "::warning::failing step id is not a plain slug; reporting unknown-step"
            name=unknown-step
          fi
          echo "Failing step: $name"
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"

  notify-failure:
    name: notify failure
    needs: chaos-e2e
    # Only on scheduled runs: a manual dispatch already shows its result to
    # the operator who triggered it.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Empty when the naming step never ran: the job timeout, a runner death, or a
          # post step failing after every main step succeeded (which leaves `if:
          # failure()` false, so the namer is skipped). Not a cancellation -- `failure()`
          # is false for a cancelled ancestor, so this job is skipped entirely. A vague
          # key beats no notification, so this falls back rather than failing.
          FAILING_STEP: ${{ needs.chaos-e2e.outputs.failing-step }}
          # See the naming step: the charset guard is a locale-collated bracket range.
          LC_ALL: C
        run: |
          # No `shell:` key means `bash -e` WITHOUT pipefail, so a failure on the left of
          # a pipe is invisible. What this and the `if !` guard below establish is that a
          # FAILED search fails the step -- so a transient `gh` error cannot masquerade as
          # "nothing found" and file a duplicate, which is the defect being fixed. They do
          # not validate an empty result set; a genuinely empty answer from search-index
          # lag still costs one duplicate, which the design accepts explicitly.
          set -euo pipefail

          step=${FAILING_STEP:-unknown-step}
          if [[ -z ${FAILING_STEP:-} ]]; then
            echo "::warning::chaos-e2e published no failing-step output; keying on unknown-step"
          fi
          # Re-check on this side of the job boundary. The producing job builds and runs
          # the whole workspace plus a submodule, and this is the job holding
          # `issues: write`, so the guard inside that job is not a control on what this
          # one consumes. Announce a rejection: a silent degrade is indistinguishable
          # from a genuine `unknown-step` in the log.
          if [[ ! $step =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo "::warning::rejected a malformed failing-step value; keying on unknown-step"
            step=unknown-step
          fi

          title="Scheduled chaos-e2e run failed: $step"

          # Assigned from its own command rather than through a pipeline, so a failed
          # search is attributable to `gh` instead of reaching jq as empty stdin -- the
          # same reason the Install ffmpeg step above writes to a file. Whether
          # `gh issue list --search` succeeds under a token scoped to `issues: write`
          # alone could not be established without merging this; if it cannot, this is
          # where it fails, by name, rather than quietly filing a duplicate.
          #
          # `in:title` matches by phrase containment, not equality, so the search only
          # narrows candidates -- the exact comparison below is the rule. `author:` is a
          # SERVER-side qualifier and is load-bearing: without it anyone can open 50
          # issues whose titles merely contain the key and push the real tracking issue
          # out of the --limit window, so the exact match finds nothing and a duplicate
          # is filed every run under their control. gh reports the Actions account as
          # `app/github-actions`, NOT `github-actions[bot]`; the client-side `is_bot`
          # check is defence in depth on top of the qualifier.
          if ! search_json=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title \"$title\" author:app/github-actions" \
            --limit 50 \
            --json number,title,author); then
            echo "::error::could not search for an existing tracking issue; refusing to file a possible duplicate"
            exit 1
          fi

          existing=$(jq -r --arg title "$title" '
            [ .[]
              | select(.title == $title and .author.is_bot? == true)
              | .number
            ] | first // empty' <<<"$search_json")

          if [[ -n $existing ]]; then
            echo "Reusing tracking issue #$existing"
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "The scheduled chaos-e2e workflow failed again at \`$step\`. Run: $RUN_URL"
            exit 0
          fi

          echo "No open tracking issue titled '$title'; creating one"
          body=$(printf '%s\n\n%s\n\n%s' \
            "The weekly scheduled chaos-e2e workflow failed at \`$step\`." \
            "Run: $RUN_URL" \
            "This issue is reused for later failures of the same step; each failed run adds a comment.")
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --label bug \
            --label status:needs-triage \
            --body "$body"
