name: chaos-e2e

on:
  workflow_dispatch:
  schedule:
    # Weekly run on the default branch so this otherwise dispatch-only job
    # cannot silently rot (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: chaos-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chaos-e2e:
    name: chaos-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Install MKVToolNix
        run: |
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix

      - name: Install ffmpeg 7
        # BtbN ships only rolling builds, so neither available tag is durable.
        # This previously tracked the `latest` tag, on the reasoning that its
        # URL is stable while dated autobuild-* tags are garbage-collected. That
        # reasoning held only while `latest` carried 7.1: BtbN rotates which
        # major versions that tag ships, and it has since dropped 7.1 in favour
        # of 8.1 and 9.0, so the 7.1 asset now 404s there permanently.
        #
        # Pin a dated tag that still carries 7.1. Its bytes are immutable, so
        # the runtime version assertion below stays meaningful. It is not a
        # permanent fix: BtbN prunes dated tags, so this URL will 404 once this
        # one is pruned. Caching or vendoring the archive is the durable answer.
        env:
          FFMPEG_ARCHIVE_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-11-13-11/ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-gpl-7.1.tar.xz
        run: |
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          install_dir="$RUNNER_TEMP/ffmpeg"
          curl -fL "$FFMPEG_ARCHIVE_URL" -o "$archive"
          mkdir -p "$install_dir"
          tar -xJf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          installed_version="$("$install_dir/bin/ffmpeg" -version | head -n1)"
          echo "Installed: $installed_version"
          if ! printf '%s\n' "$installed_version" | grep -Eq 'version n?7\.1[ .-]'; then
            echo "::error::expected ffmpeg 7.1.x, got: $installed_version"
            exit 1
          fi

      - name: Verify external tools
        run: |
          uv --version
          uv python install 3.13
          uv run --python 3.13 python --version
          ffmpeg -version
          ffprobe -version
          mkvmerge --version

      - name: Run Chaos Librarian E2E
        run: just chaos-e2e-ci

  notify-failure:
    name: notify failure
    needs: chaos-e2e
    # Only on scheduled runs: a manual dispatch already shows its result to
    # the operator who triggered it.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Scheduled chaos-e2e run failed" \
            --body "The weekly scheduled chaos-e2e workflow failed. Run: $RUN_URL"
