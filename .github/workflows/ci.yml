name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-guards:
    name: source guards (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: '1.58.0'
      - name: Install ast-grep
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
        with:
          tool: ast-grep
      - name: Install workflow analyzers
        run: just setup-workflow-tools
      - name: Source checks
        run: just source-checks

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Install cargo-deny + cargo-audit
        run: cargo install --locked cargo-deny cargo-audit

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix

      - name: Install ffmpeg + mkvtoolnix (macOS)
        if: runner.os == 'macOS'
        run: brew list ffmpeg mkvtoolnix >/dev/null 2>&1 || brew install ffmpeg mkvtoolnix

      - name: Platform checks
        run: just platform-checks

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Skip on fork PRs: GitHub does not expose secrets to fork workflows.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # SonarCloud uses git history for blame.

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
        with:
          tool: cargo-llvm-cov

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix

      - name: Generate lcov
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info -- --test-threads=1

      - name: SonarCloud scan
        # Dependabot PRs cannot read repository secrets; keep lcov generation but skip upload.
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  pcm-container:
    name: PCM container (Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: '1.58.0'
      - name: Install fixture media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix
      - name: Provision acceptance Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: '3.13'
          activate-environment: true
          no-project: true
      - name: Verify acceptance Python
        run: python3 -c 'import sys; assert sys.version_info >= (3, 13), sys.version'
      - name: Build pinned native image
        run: |
          image=$(just container-build docker)
          printf 'PCM_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Verify PCM headers, samples, remux and software profile
        run: just container-check docker "$PCM_IMAGE"
      - name: Verify operation lifecycle and mounts
        run: just container-runtime-check docker "$PCM_IMAGE"
      - name: Exercise required PCM worker cases
        run: just container-worker-check docker "$PCM_IMAGE"
      - name: Verify copied packet publication and native rejection
        run: just copied-audio-check docker "$PCM_IMAGE"
      - name: Exercise required generated audio owner CLI acceptance
        run: just audio-acceptance docker "$PCM_IMAGE"
