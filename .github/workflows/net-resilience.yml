name: net-resilience

on:
  workflow_dispatch:
  schedule:
    # Weekly run on the default branch so this otherwise dispatch-only job
    # cannot silently rot (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: net-resilience-${{ github.ref }}
  cancel-in-progress: false

jobs:
  net-resilience:
    name: net-resilience
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3  # v2.9.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Run network-resilience suite
        # The recipe downloads + SHA256-verifies the pinned toxiproxy-server,
        # starts it, runs the #[ignore]d suite, and reaps the server.
        run: just net-resilience-ci

  notify-failure:
    name: notify failure
    needs: net-resilience
    # Only on scheduled runs: a manual dispatch already shows its result to
    # the operator who triggered it.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          title="Scheduled net-resilience run failed"
          # Search failure must not be mistaken for absence. Job-token search permission
          # remains unverified until the first scheduled failure.
          if ! search_json=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title \"$title\" author:app/github-actions" \
            --limit 50 \
            --json number,title,author); then
            echo "::error::could not search for an existing tracking issue; refusing to file a possible duplicate"
            exit 1
          fi

          # Search narrows by containment; only an exact title from a bot is reusable.
          existing=$(jq -r --arg title "$title" '
            [ .[]
              | select(.title == $title and .author.is_bot? == true)
              | .number
            ] | first // empty' <<<"$search_json")

          if [[ -n $existing ]]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "The weekly scheduled net-resilience workflow failed again. Run: $RUN_URL"
            exit 0
          fi

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --label bug \
            --label status:needs-triage \
            --body "The weekly scheduled net-resilience workflow failed. Run: $RUN_URL"
