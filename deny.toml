[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = []
skip = [
    # sqlx-core pulls hashbrown 0.15.5 through hashlink. Tolerate only 0.15.5;
    # the hashbrown 0.17.1 baseline remains unskipped.
    { crate = "hashbrown@0.15.5", reason = "tolerated 0.15.5; baseline 0.17.1" },
    # directories pulls getrandom 0.2.17 and rand pulls 0.3.4. Tolerate those
    # two versions only; the getrandom 0.4.2 baseline remains unskipped.
    { crate = "getrandom@0.2.17", reason = "tolerated 0.2.17, 0.3.4; baseline 0.4.2" },
    { crate = "getrandom@0.3.4", reason = "tolerated 0.2.17, 0.3.4; baseline 0.4.2" },
    # sqlx-core's sha2 stack uses cpufeatures 0.2.17. Tolerate only 0.2.17;
    # the cpufeatures 0.3.0 baseline from blake3 remains unskipped.
    { crate = "cpufeatures@0.2.17", reason = "tolerated 0.2.17; baseline 0.3.0" },
    # getrandom 0.3.4 and 0.4.2 use different WASI adapter generations.
    # Tolerate r-efi 5.3.0; the r-efi 6.0.0 baseline remains unskipped.
    { crate = "r-efi@5.3.0", reason = "tolerated 5.3.0; baseline 6.0.0" },
    # Tolerate wit-bindgen 0.51.0; the wit-bindgen 0.57.1 baseline remains unskipped.
    { crate = "wit-bindgen@0.51.0", reason = "tolerated 0.51.0; baseline 0.57.1" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
