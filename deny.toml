[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "ISC",
]
exceptions = [
    # reqwest's cross-platform Rustls verifier bundles public root data for
    # targets without a native verifier. Scope its permissive data license to
    # the exact reviewed package instead of widening the workspace allowlist.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs@1.0.9" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = []
skip = [
    # sqlx-core pulls hashbrown 0.15.5 through hashlink. Tolerate only 0.15.5;
    # the hashbrown 0.17.1 baseline remains unskipped.
    { crate = "hashbrown@0.15.5", reason = "tolerated 0.15.5; baseline 0.17.1" },
    # directories pulls getrandom 0.2.17 and rand pulls 0.3.4. Tolerate those
    # two versions only; the getrandom 0.4.2 baseline remains unskipped.
    { crate = "getrandom@0.2.17", reason = "tolerated 0.2.17, 0.3.4; baseline 0.4.2" },
    { crate = "getrandom@0.3.4", reason = "tolerated 0.2.17, 0.3.4; baseline 0.4.2" },
    # sqlx-core's sha2 stack uses cpufeatures 0.2.17. Tolerate only 0.2.17;
    # the cpufeatures 0.3.0 baseline from blake3 remains unskipped.
    { crate = "cpufeatures@0.2.17", reason = "tolerated 0.2.17; baseline 0.3.0" },
    # getrandom 0.3.4 and 0.4.2 use different WASI adapter generations.
    # Tolerate r-efi 5.3.0; the r-efi 6.0.0 baseline remains unskipped.
    { crate = "r-efi@5.3.0", reason = "tolerated 5.3.0; baseline 6.0.0" },
    # Tolerate wit-bindgen 0.51.0; the wit-bindgen 0.57.1 baseline remains unskipped.
    { crate = "wit-bindgen@0.51.0", reason = "tolerated 0.51.0; baseline 0.57.1" },
    # ring 0.17.14 retains the older Windows bindings. Tolerate only that transitive
    # version; the workspace's windows-sys 0.61.2 baseline remains unskipped.
    { crate = "windows-sys@0.52.0", reason = "ring TLS provider; baseline 0.61.2" },
    # reqwest 0.13.4 pulls tower-http 0.6.11; reqwest hasn't published a release
    # against tower-http 0.7 yet. Tolerate only that transitive version; the
    # workspace's tower-http 0.7.0 baseline remains unskipped.
    { crate = "tower-http@0.6.11", reason = "reqwest 0.13.4 pinned; baseline 0.7.0" },
    # hyper-util, pem, reqwest, and sqlx-core pull base64 0.22.1; none has
    # published a release against base64 0.23 yet. Tolerate only that
    # transitive version; the workspace's base64 0.23.1 baseline remains unskipped.
    { crate = "base64@0.22.1", reason = "hyper-util/pem/reqwest/sqlx-core pinned; baseline 0.23.1" },
    # blake3's dev-dependencies pull constant_time_eq 0.4.2; blake3 hasn't
    # published a release against constant_time_eq 0.5 yet. Tolerate only
    # that transitive version; the workspace's 0.5.0 baseline remains unskipped.
    { crate = "constant_time_eq@0.4.2", reason = "blake3 dev-dependency pinned; baseline 0.5.0" },
    # async-trait, clap_derive, serde_derive, and thiserror-impl have moved to
    # syn 3; tokio-macros, tracing-attributes, and the zerovec/yoke derive
    # crates haven't yet. Tolerate the early-adopter version; the syn 2.0.117
    # baseline used by the rest of the proc-macro graph remains unskipped.
    { crate = "syn@3.0.3", reason = "async-trait/clap_derive/serde_derive/thiserror-impl early adopters; baseline 2.0.117" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
